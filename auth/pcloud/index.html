<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Photomingo – connecting pCloud</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #FFF8F0; color: #1E1E1E; }
    main { text-align: center; padding: 2rem; max-width: 26rem; }
    img { width: 96px; height: 96px; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #555; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 1.25rem; padding: .9rem 1.8rem; border-radius: 999px;
            background: #2EC4B6; color: #fff; font-weight: 600; text-decoration: none; font-size: 1.05rem; }
    .err { color: #B3261E; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icon.png" alt="">
    <h1 id="title">Connecting pCloud…</h1>
    <p id="msg">Returning you to Photomingo.</p>
    <a class="btn" id="open" href="#" hidden>Open Photomingo</a>
  </main>
  <script>
    // pCloud's OAuth token flow lands here with the access token in the URL fragment
    // (never sent to any server). Hand the whole query + fragment to the Android app
    // through its private scheme. On a phone with Photomingo installed and the App
    // Link verified, Android opens the app before this page even renders; this page
    // is the fallback for unverified links, where the browser needs a tap to leave.
    (function () {
      var target = "com.photomingo.app.pcloud://oauth2redirect" + location.search + location.hash;
      var hasToken = /(^|[#&?])access_token=/.test(location.hash + location.search);
      var open = document.getElementById("open");
      open.href = target;
      open.hidden = false;
      if (!hasToken) {
        document.getElementById("title").textContent = "pCloud sign-in didn't complete";
        document.getElementById("msg").innerHTML =
          '<span class="err">No access token was returned.</span> Go back to Photomingo and try again.';
        return;
      }
      // Best effort: browsers usually require a tap for app-scheme navigation, so the
      // button stays visible either way.
      try { location.replace(target); } catch (e) {}
    })();
  </script>
</body>
</html>
